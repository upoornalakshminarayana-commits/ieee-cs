<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#0a0703" rx="8"/>
  <!-- Scarab body -->
  <ellipse cx="32" cy="36" rx="14" ry="16" fill="#c8972e" opacity="0.9"/>
  <!-- Wing lines -->
  <line x1="32" y1="22" x2="32" y2="52" stroke="#0a0703" stroke-width="1.5"/>
  <line x1="20" y1="30" x2="44" y2="30" stroke="#0a0703" stroke-width="1"/>
  <line x1="20" y1="36" x2="44" y2="36" stroke="#0a0703" stroke-width="1"/>
  <line x1="20" y1="42" x2="44" y2="42" stroke="#0a0703" stroke-width="1"/>
  <!-- Head -->
  <circle cx="32" cy="18" r="6" fill="#c8972e"/>
  <!-- Antennae -->
  <line x1="28" y1="14" x2="22" y2="8" stroke="#c8972e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="14" x2="42" y2="8" stroke="#c8972e" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="22" cy="8" r="1.5" fill="#e8b84b"/>
  <circle cx="42" cy="8" r="1.5" fill="#e8b84b"/>
  <!-- Legs -->
  <line x1="19" y1="28" x2="10" y2="24" stroke="#c8972e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="36" x2="10" y2="36" stroke="#c8972e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="44" x2="10" y2="50" stroke="#c8972e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="45" y1="28" x2="54" y2="24" stroke="#c8972e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="45" y1="36" x2="54" y2="36" stroke="#c8972e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="45" y1="44" x2="54" y2="50" stroke="#c8972e" stroke-width="1.5" stroke-linecap="round"/>
</svg>
